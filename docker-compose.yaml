
x-mesh-service: &mesh-service
  image: servicemap/mesh-service
  mem_limit: 640m
  environment: &mesh-environment
    OTLP_ENDPOINT: http://lgtm:4318
  depends_on:
    - lgtm

services:
  lgtm:
    image: grafana/otel-lgtm:latest
    environment:
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./lgtm/tempo-config.yaml:/otel-lgtm/tempo-config.yaml
      - ./grafana/provisioning/servicemap-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/servicemap-dashboards.yaml
      - ./grafana/dashboards:/otel-lgtm/servicemap-dashboards
      - ./grafana/plugins/marcusolsson-dynamictext-panel:/data/grafana/plugins/marcusolsson-dynamictext-panel:ro

  service-c:
    image: servicemap/service-c
    environment:
      OTLP_ENDPOINT: http://lgtm:4318
    ports:
      - "8083:8080"
    depends_on:
      - lgtm

  service-b:
    image: servicemap/service-b
    environment:
      OTLP_ENDPOINT: http://lgtm:4318
      SERVICE_C_URL: http://service-c:8080
    ports:
      - "8082:8080"
    depends_on:
      - service-c

  service-d:
    image: servicemap/service-d
    environment:
      OTLP_ENDPOINT: http://lgtm:4318
      SERVICE_C_URL: http://service-c:8080
    ports:
      - "8084:8080"
    depends_on:
      - service-c

  service-a:
    image: servicemap/service-a
    environment:
      OTLP_ENDPOINT: http://lgtm:4318
      SERVICE_B_URL: http://service-b:8080
      SERVICE_D_URL: http://service-d:8080
    ports:
      - "8081:8080"
    depends_on:
      - service-b
      - service-d

  api-gateway:
    <<: *mesh-service
    environment:
      <<: *mesh-environment
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/
    volumes:
      - ./mesh/api-gateway.yaml:/config/application.yaml:ro
  mobile-banking-bff:
    <<: *mesh-service
    environment:
      <<: *mesh-environment
      SPRING_APPLICATION_NAME: mobile-banking-bff
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/
    volumes:
      - ./mesh/mobile-banking-bff.yaml:/config/application.yaml:ro
  payment-orchestrator:
    <<: *mesh-service
    environment:
      <<: *mesh-environment
      SPRING_APPLICATION_NAME: payment-orchestrator
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/

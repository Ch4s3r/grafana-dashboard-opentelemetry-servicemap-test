spring:
  application:
    name: service-a
server:
  port: 8080
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
service-b:
  url: ${SERVICE_B_URL:http://localhost:8082}
service-d:
  url: ${SERVICE_D_URL:http://localhost:8084}
